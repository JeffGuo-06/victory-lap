name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck teams-ringtone test/test.sh install.sh

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x teams-ringtone test/test.sh && ./test/test.sh
      - run: python3 test/test_patch_cache.py
